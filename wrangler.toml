name = "clock"
main = "src/worker.mjs"
compatibility_date = "2026-08-04"
compatibility_flags = ["new_module_registry", "nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "clock.abc-p.com/*"
zone_name = "abc-p.com"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[build]
command = "pnpm run build:worker"
watch_dir = ["src", "public", "rust/clock-wasm/src", "rust/clock-wasm/Cargo.toml", "rust/clock-wasm/Cargo.lock", "scripts/build-worker.sh"]
